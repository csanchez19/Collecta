<section aria-label="En tu colección">
  @if (copies() > 0) {
    <div class="owned chamfer">
      <div class="texts">
        <span class="title">
          <ion-icon name="checkmark" aria-hidden="true"></ion-icon>
          En tu colección
        </span>
        <span class="copies">{{ copiesLabel() }}</span>
      </div>
      <div class="stepper">
        <button type="button" aria-label="Quitar una copia" (click)="decrement.emit()">
          <ion-icon name="remove" aria-hidden="true"></ion-icon>
        </button>
        <span class="num" aria-live="polite">{{ copies() }}</span>
        <button type="button" aria-label="Añadir una copia" (click)="increment.emit()">
          <ion-icon name="add" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </div>
  } @else {
    <button class="btn-primary chamfer" type="button" (click)="increment.emit()">
      <ion-icon name="add" aria-hidden="true"></ion-icon>
      Añadir a mi colección
      <span class="xp num">+{{ xpReward() }} XP</span>
    </button>
  }
  @if (saveFailed()) {
    <p class="error" role="alert">No se ha podido guardar el cambio. Inténtalo de nuevo.</p>
  }
</section>
