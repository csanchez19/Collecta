<article class="card chamfer" [style.--hue]="vm().hue">
  <button class="open" type="button" (click)="open.emit()">
    <div class="banner tone-bg stripes">
      <span class="ghost num tone-fg" aria-hidden="true">{{ vm().ghost }}</span>
      <span class="icon chamfer tone-fg" aria-hidden="true">
        <ion-icon [name]="kindIcon()"></ion-icon>
      </span>
      <span class="kind tone-fg">{{ vm().kindLabel }}</span>
    </div>

    <div class="body">
      <div class="row">
        <h3 class="name num">{{ vm().name }}</h3>
        <span class="count num">{{ vm().ownedLabel }}<span class="num-dim">/{{ vm().totalLabel }}</span></span>
      </div>
      <app-segment-bar [ratio]="vm().ratio" />
      <div class="row meta">
        <span>{{ vm().meta }}</span>
        <span class="value num">{{ vm().valueLabel }}</span>
      </div>
    </div>
  </button>

  <button
    class="favorite"
    type="button"
    [attr.aria-pressed]="vm().isFavorite"
    [attr.aria-label]="vm().isFavorite ? 'Quitar de favoritas' : 'Marcar como favorita'"
    (click)="favoriteToggle.emit()"
  >
    <ion-icon [name]="vm().isFavorite ? 'star' : 'star-outline'" aria-hidden="true"></ion-icon>
  </button>
</article>
