<div
  class="thumb tone-mid"
  [class]="'is-' + state() + ' as-' + variant()"
  [class.has-image]="hasImage()"
  [style.--hue]="hue()"
  aria-hidden="true"
>
  @if (hasImage() && imageUrl(); as url) {
    @if (!isLoaded()) {
      <span class="shimmer"></span>
    }
    <img [src]="url" alt="" loading="lazy" [class.loaded]="isLoaded()" (load)="onLoad(url)" (error)="onError(url)" />
  } @else if (showsCode()) {
    <span class="code num">{{ code() }}</span>
  } @else {
    <span class="sil-head"><span></span><span></span></span>
    <span class="sil-art tone-art"></span>
    <span class="sil-line"></span>
    <span class="sil-line short"></span>
  }

  @if (state() === 'wished') {
    <span class="badge wish"><ion-icon name="heart"></ion-icon></span>
  }
  @if (copies() > 1) {
    <span class="badge copies num">×{{ copies() }}</span>
  }
</div>
